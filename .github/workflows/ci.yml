name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          ini-values: short_open_tag=On
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate cPanel launch safeguards
        run: |
          bash -n scripts/prepare-cpanel-production.sh
          bash -n scripts/cutover-cpanel-production.sh
          bash -n scripts/rollback-cpanel-production.sh
          grep -Fq 'APP_KEY="$TEST_APP_KEY"' scripts/prepare-cpanel-production.sh
          grep -Fq 'APP_URL=http://localhost' scripts/prepare-cpanel-production.sh
          grep -Fq 'CACHE_STORE=array php artisan optimize:clear' scripts/prepare-cpanel-production.sh
          php -l deployment/cpanel-main-root/index.php

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Validate database and test suite
        run: |
          php artisan migrate --seed --force
          php artisan website:release-audit --show-warnings
          php artisan test

      - name: Build frontend assets
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run audit:assets
