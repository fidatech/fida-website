<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Fida Technologies</title>
  <desc id="description">Enterprise software, ERP and digital transformation in Afghanistan</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070c"/>
      <stop offset="0.55" stop-color="#07101d"/>
      <stop offset="1" stop-color="#0d0920"/>
    </linearGradient>
    <radialGradient id="lime-glow" cx="0" cy="0" r="1" gradientTransform="translate(1030 70) rotate(135) scale(500 360)">
      <stop stop-color="#c9ff4a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c9ff4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow" cx="0" cy="0" r="1" gradientTransform="translate(990 570) rotate(-145) scale(520 360)">
      <stop stop-color="#846cff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#846cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d7ff73"/>
      <stop offset="0.48" stop-color="#72f3ca"/>
      <stop offset="1" stop-color="#846cff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="0" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#lime-glow)"/>
  <rect width="1200" height="630" fill="url(#violet-glow)"/>

  <path d="M785 85C949 43 1106 107 1160 241" fill="none" stroke="#c9ff4a" stroke-opacity="0.28" stroke-width="2"/>
  <path d="M758 560C923 612 1082 550 1154 418" fill="none" stroke="#846cff" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="1095" cy="160" r="5" fill="#c9ff4a"/>
  <circle cx="1050" cy="500" r="5" fill="#846cff"/>

  <g transform="translate(84 82)" filter="url(#shadow)">
    <rect width="126" height="126" rx="30" fill="#0e1420" stroke="#ffffff" stroke-opacity="0.1"/>
    <path d="M29 25h70v22H52v17h36v21H52v39H29z" fill="url(#mark)"/>
    <path d="M85 84h22v40H85z" fill="#846cff"/>
  </g>

  <text x="240" y="144" fill="#f7f9fb" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="750" letter-spacing="-1">Fida Technologies</text>
  <text x="242" y="183" fill="#aeb8c8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="3">AFGHANISTAN</text>

  <text x="84" y="330" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="750" letter-spacing="-2">Enterprise software built</text>
  <text x="84" y="402" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="750" letter-spacing="-2">for serious operations.</text>

  <g transform="translate(84 474)">
    <rect width="116" height="44" rx="22" fill="#c9ff4a" fill-opacity="0.12" stroke="#c9ff4a" stroke-opacity="0.45"/>
    <text x="58" y="29" text-anchor="middle" fill="#d7ff73" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">ERP</text>
    <rect x="132" width="116" height="44" rx="22" fill="#4ee8ff" fill-opacity="0.1" stroke="#4ee8ff" stroke-opacity="0.38"/>
    <text x="190" y="29" text-anchor="middle" fill="#8ef2ff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">MIS</text>
    <rect x="264" width="220" height="44" rx="22" fill="#846cff" fill-opacity="0.13" stroke="#9c8cff" stroke-opacity="0.42"/>
    <text x="374" y="29" text-anchor="middle" fill="#c0b8ff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">Digital transformation</text>
  </g>

  <text x="84" y="576" fill="#8995a8" font-family="Inter, Arial, sans-serif" font-size="18" letter-spacing="0.5">fida.af</text>
</svg>
